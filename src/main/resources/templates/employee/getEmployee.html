<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body>

<div class="container">
    <h3>Employee Details</h3>
    <hr>
    <a th:href="@{/employee/addEmployee}" class="btn btn-primary btn-sm mb-3">Add Employee</a>

    <table class="table table-dark table-bordered table-striped table-hover ">
        <thead>
        <tr>
            <th>FirstName</th>
            <th>LastName</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempEmployee : ${employee}">
            <td th:text="${tempEmployee.firstname}"></td>
            <td th:text="${tempEmployee.lastname}"></td>
            <td th:text="${tempEmployee.email}"></td>
            <td>
                <a th:href="@{/employee/updateEmployee (employeeId= ${tempEmployee.id})}"
                class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/employee/deleteEmployee(employeeId= ${tempEmployee.id})}"
                class="btn btn-danger btn-sm"
                onclick="if(!(confirm('Do you want to delete Employee ? ')))return false">Delete</a>
            </td>

        </tr>
        </tbody>
    </table>

</div>



</body>
</html>
