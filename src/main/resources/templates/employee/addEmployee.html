<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body>
<div class="container">
    <h3>Employee List</h3>
    <p class="h4 mb-4">Save Teacher</p>
    <hr>
    <form action="#" th:action="@{/employee/saveEmployee}" th:object="${employee}" method="POST">
        <input type="hidden" th:field="*{id}" />
        <input type="text" th:field="*{firstname}" placeholder="First Name" class="form-control mb-3 w-20" >
        <input type="text" th:field="*{lastname}" placeholder="Last Name" class="form-control mb-3 w-20" >
        <input type="text" th:field="*{email}" placeholder="email" class="form-control mb-3 w-20" >
        <button type="submit" class="btn btn-info col-3">Save</button>
    </form>
    <br><br>
    <a th:href="@{/}">Back to th Teacher</a>

</div>
</body>
</html>
